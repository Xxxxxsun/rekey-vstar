<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>REKEY GT Label Tool</title>
  <style>
    :root {
      --bg: #f7f7f4;
      --panel: #ffffff;
      --text: #1f2933;
      --muted: #667085;
      --line: #d7d9de;
      --blue: #2563eb;
      --red: #dc2626;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      background: var(--bg);
      color: var(--text);
      font-family: Arial, Helvetica, sans-serif;
    }

    main {
      width: min(1180px, calc(100vw - 32px));
      margin: 24px auto;
    }

    header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      margin-bottom: 16px;
    }

    h1 {
      margin: 0;
      font-size: 22px;
      font-weight: 700;
      letter-spacing: 0;
    }

    .toolbar,
    .panel,
    .readout {
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 8px;
      box-shadow: 0 8px 18px rgba(15, 23, 42, 0.06);
    }

    .toolbar {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      padding: 12px;
      margin-bottom: 16px;
    }

    button {
      height: 36px;
      border: 1px solid var(--line);
      border-radius: 6px;
      background: #fff;
      color: var(--text);
      cursor: pointer;
      font-weight: 700;
      padding: 0 12px;
    }

    button:hover {
      border-color: #9ca3af;
    }

    button.active {
      background: var(--text);
      border-color: var(--text);
      color: #fff;
    }

    button.original.active {
      background: var(--blue);
      border-color: var(--blue);
    }

    button.relabel.active {
      background: var(--red);
      border-color: var(--red);
    }

    .spacer {
      flex: 1 1 auto;
    }

    .grid {
      display: grid;
      grid-template-columns: minmax(0, 1fr) 360px;
      gap: 16px;
      align-items: start;
    }

    .panel {
      padding: 12px;
      overflow: hidden;
    }

    .legend {
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
      align-items: center;
      margin-bottom: 10px;
      color: var(--muted);
      font-size: 13px;
      font-weight: 700;
    }

    .legend span {
      display: inline-flex;
      align-items: center;
      gap: 6px;
    }

    .swatch {
      width: 18px;
      height: 10px;
      border-radius: 2px;
      border: 2px solid currentColor;
    }

    .swatch.original {
      color: var(--blue);
    }

    .swatch.relabel {
      color: var(--red);
    }

    canvas {
      display: block;
      width: 100%;
      height: auto;
      border: 1px solid var(--line);
      border-radius: 6px;
      background: #e5e7eb;
      cursor: crosshair;
      touch-action: none;
    }

    .readout {
      padding: 14px;
    }

    .example-title {
      margin: 0 0 10px;
      font-size: 15px;
      font-weight: 700;
    }

    .meta {
      margin: 0 0 12px;
      color: var(--muted);
      font-size: 13px;
      line-height: 1.45;
    }

    textarea {
      width: 100%;
      min-height: 280px;
      resize: vertical;
      border: 1px solid var(--line);
      border-radius: 6px;
      padding: 10px;
      font: 12px/1.45 Menlo, Consolas, monospace;
      color: var(--text);
      background: #fbfbfc;
    }

    .status {
      min-height: 18px;
      margin-top: 10px;
      color: var(--muted);
      font-size: 13px;
    }

    @media (max-width: 900px) {
      .grid {
        grid-template-columns: 1fr;
      }

      header {
        display: block;
      }
    }
  </style>
</head>
<body>
  <main>
    <header>
      <h1>REKEY GT Label Tool</h1>
      <div class="meta">Blue = Original V*. Red = Fresh Relabel V*.</div>
    </header>

    <section class="toolbar" aria-label="Label controls">
      <button class="example active" data-id="0096">0096</button>
      <button class="example" data-id="0065">0065</button>
      <button class="example" data-id="0061">0061</button>
      <span class="spacer"></span>
      <button class="mode original active" data-mode="original">Original GT</button>
      <button class="mode relabel" data-mode="relabel">Relabel GT</button>
      <button id="undo">Clear Current</button>
      <button id="copy">Copy JSON</button>
    </section>

    <section class="grid">
      <div class="panel">
        <div class="legend" aria-label="Box color legend">
          <span><i class="swatch original"></i>Original GT</span>
          <span><i class="swatch relabel"></i>Relabel GT</span>
        </div>
        <canvas id="canvas"></canvas>
      </div>
      <aside class="readout">
        <p id="example-title" class="example-title"></p>
        <p id="example-meta" class="meta"></p>
        <textarea id="json" readonly></textarea>
        <div id="status" class="status"></div>
      </aside>
    </section>
  </main>

  <script>
    const examples = [
      {
        id: '0096',
        image: '../static/images/leakage-raw-0096.jpg',
        original: 'bottle cap, red',
        relabel: 'clip, red'
      },
      {
        id: '0065',
        image: '../static/images/leakage-raw-0065.jpg',
        original: 'broom, black',
        relabel: 'spring, yellow'
      },
      {
        id: '0061',
        image: '../static/images/leakage-raw-0061.jpg',
        original: 'dog, white',
        relabel: 'bird on the ground, brown'
      }
    ];

    const canvas = document.getElementById('canvas');
    const ctx = canvas.getContext('2d');
    const jsonEl = document.getElementById('json');
    const statusEl = document.getElementById('status');
    const titleEl = document.getElementById('example-title');
    const metaEl = document.getElementById('example-meta');
    const storageKey = 'rekey-vstar-manual-labels-v1';

    let currentId = '0096';
    let currentMode = 'original';
    let image = new Image();
    let dragging = null;
    let boxes = loadBoxes();

    function loadBoxes() {
      try {
        return JSON.parse(localStorage.getItem(storageKey)) || {};
      } catch (_) {
        return {};
      }
    }

    function saveBoxes() {
      localStorage.setItem(storageKey, JSON.stringify(boxes));
    }

    function currentExample() {
      return examples.find((example) => example.id === currentId);
    }

    function ensureExampleState(id) {
      boxes[id] = boxes[id] || {};
      return boxes[id];
    }

    function setStatus(text) {
      statusEl.textContent = text;
      if (!text) return;
      window.clearTimeout(setStatus.timer);
      setStatus.timer = window.setTimeout(() => {
        statusEl.textContent = '';
      }, 1800);
    }

    function resizeCanvas() {
      if (!image.naturalWidth) return;
      const panel = canvas.parentElement;
      const width = Math.floor(panel.clientWidth - 24);
      const scale = width / image.naturalWidth;
      canvas.width = width;
      canvas.height = Math.round(image.naturalHeight * scale);
      draw();
    }

    function naturalToCanvas(rect) {
      const sx = canvas.width / image.naturalWidth;
      const sy = canvas.height / image.naturalHeight;
      return {
        x: rect.x * sx,
        y: rect.y * sy,
        width: rect.width * sx,
        height: rect.height * sy
      };
    }

    function canvasToNatural(rect) {
      const sx = image.naturalWidth / canvas.width;
      const sy = image.naturalHeight / canvas.height;
      return {
        x: Math.round(rect.x * sx),
        y: Math.round(rect.y * sy),
        width: Math.round(rect.width * sx),
        height: Math.round(rect.height * sy)
      };
    }

    function normalizeRect(rect) {
      const x1 = Math.max(0, Math.min(rect.x, rect.x + rect.width));
      const y1 = Math.max(0, Math.min(rect.y, rect.y + rect.height));
      const x2 = Math.min(canvas.width, Math.max(rect.x, rect.x + rect.width));
      const y2 = Math.min(canvas.height, Math.max(rect.y, rect.y + rect.height));
      return { x: x1, y: y1, width: x2 - x1, height: y2 - y1 };
    }

    function drawBox(rect, mode, active) {
      const color = mode === 'original' ? '#2563eb' : '#dc2626';
      ctx.save();
      ctx.lineWidth = active ? 4 : 3;
      ctx.strokeStyle = color;
      ctx.strokeRect(rect.x, rect.y, rect.width, rect.height);
      ctx.restore();
    }

    function draw() {
      if (!image.naturalWidth) return;
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      ctx.drawImage(image, 0, 0, canvas.width, canvas.height);

      const exampleBoxes = boxes[currentId] || {};
      ['original', 'relabel'].forEach((mode) => {
        if (!exampleBoxes[mode]) return;
        drawBox(naturalToCanvas(exampleBoxes[mode]), mode, mode === currentMode);
      });

      if (dragging) {
        drawBox(normalizeRect(dragging), currentMode, true);
      }
    }

    function updateText() {
      const example = currentExample();
      titleEl.textContent = `vstar_${example.id}`;
      metaEl.textContent = `Original: ${example.original}. Relabel: ${example.relabel}.`;
      const payload = {
        version: 1,
        coordinate_space: 'original_image_pixels',
        examples: examples.map((item) => ({
          id: item.id,
          image: item.image.replace('../', ''),
          original_target: item.original,
          relabel_target: item.relabel,
          boxes: boxes[item.id] || {}
        }))
      };
      jsonEl.value = JSON.stringify(payload, null, 2);
    }

    function loadCurrentImage() {
      const example = currentExample();
      image = new Image();
      image.onload = () => {
        resizeCanvas();
        updateText();
      };
      image.src = example.image;
    }

    function setCurrentId(id) {
      currentId = id;
      document.querySelectorAll('.example').forEach((button) => {
        button.classList.toggle('active', button.dataset.id === id);
      });
      loadCurrentImage();
    }

    function setMode(mode) {
      currentMode = mode;
      document.querySelectorAll('.mode').forEach((button) => {
        button.classList.toggle('active', button.dataset.mode === mode);
      });
      draw();
    }

    function pointFromEvent(event) {
      const rect = canvas.getBoundingClientRect();
      return {
        x: (event.clientX - rect.left) * (canvas.width / rect.width),
        y: (event.clientY - rect.top) * (canvas.height / rect.height)
      };
    }

    canvas.addEventListener('pointerdown', (event) => {
      if (!image.naturalWidth) return;
      canvas.setPointerCapture(event.pointerId);
      const point = pointFromEvent(event);
      dragging = { x: point.x, y: point.y, width: 0, height: 0 };
      draw();
    });

    canvas.addEventListener('pointermove', (event) => {
      if (!dragging) return;
      const point = pointFromEvent(event);
      dragging.width = point.x - dragging.x;
      dragging.height = point.y - dragging.y;
      draw();
    });

    canvas.addEventListener('pointerup', (event) => {
      if (!dragging) return;
      const rect = normalizeRect(dragging);
      dragging = null;
      if (rect.width >= 4 && rect.height >= 4) {
        ensureExampleState(currentId)[currentMode] = canvasToNatural(rect);
        saveBoxes();
        updateText();
        setStatus('Saved');
      }
      draw();
    });

    document.querySelectorAll('.example').forEach((button) => {
      button.addEventListener('click', () => setCurrentId(button.dataset.id));
    });

    document.querySelectorAll('.mode').forEach((button) => {
      button.addEventListener('click', () => setMode(button.dataset.mode));
    });

    document.getElementById('undo').addEventListener('click', () => {
      const exampleBoxes = ensureExampleState(currentId);
      delete exampleBoxes[currentMode];
      saveBoxes();
      updateText();
      draw();
      setStatus('Cleared');
    });

    document.getElementById('copy').addEventListener('click', async () => {
      await navigator.clipboard.writeText(jsonEl.value);
      setStatus('Copied');
    });

    window.addEventListener('resize', resizeCanvas);
    loadCurrentImage();
  </script>
</body>
</html>
